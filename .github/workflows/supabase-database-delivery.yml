name: Supabase Database Delivery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose a controlled database operation"
        required: true
        type: choice
        options:
          - verify
          - baseline
          - deploy

permissions:
  contents: read

concurrency:
  group: v9-odysseus-supabase-production
  cancel-in-progress: false

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate required secrets
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "Missing SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo "Missing SUPABASE_DB_PASSWORD"; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "Missing SUPABASE_PROJECT_REF"; exit 1; }

      - name: Link intended Supabase project
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify migration history (read only)
        if: inputs.mode == 'verify'
        run: supabase migration list --remote

      # Run this only after confirming the six V9.8 tables and their RLS policies
      # already exist in the intended Supabase project. This records the manually
      # executed migration; it does not execute the SQL migration again.
      - name: Record manually applied V9.8 baseline
        if: inputs.mode == 'baseline'
        run: |
          set -euo pipefail
          supabase migration repair 202611270001 --status applied --yes --remote
          supabase migration list --remote

      - name: Preview pending migrations
        if: inputs.mode == 'deploy'
        run: supabase db push --dry-run --remote

      - name: Apply pending migrations
        if: inputs.mode == 'deploy'
        run: supabase db push --yes --remote
