
name: V9 Odysseus Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  v9-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout V9
        uses: actions/checkout@v4
        with:
          ref: v4.5.3-development

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run V9
        run: python main.py
