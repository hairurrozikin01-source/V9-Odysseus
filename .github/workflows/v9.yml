
        
name: V9 Odysseus Engine

"on":
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  v9-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Download V9
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run V9
        run: python main.py

