name: V9 Odysseus Engine

on:
  workflow_dispatch:
  push:
    branches:
      - v9.4.6-development
      - v9.5-odysseus-development
  schedule:
    - cron: "*/15 * * * *"

concurrency:
  group: v9-odysseus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v9-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V9
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore persistent signal history
        uses: actions/cache/restore@v4
        with:
          path: .v9-state/
          key: v9-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v9-state-${{ runner.os }}-

      - name: Test V9, SHIB Hunter, and Odysseus
        run: python -m unittest discover -s tests -v

      - name: Run V9
        run: python main.py

      - name: Run SHIB Hunter multi-chain radar
        id: shib-hunter
        run: python shib_hunter.py

      - name: Run Odysseus read-only audit
        run: python odysseus.py

      - name: Save persistent signal history
        uses: actions/cache/save@v4
        with:
          path: .v9-state/
          key: v9-state-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload V9, SHIB Hunter, and Odysseus reports
        uses: actions/upload-artifact@v4
        with:
          name: v9-odysseus-reports-${{ github.run_id }}
          path: |
            v9_scan_results.json
            shib_hunter_results.json
            odysseus_audit_report.json
          if-no-files-found: warn
          retention-days: 7
